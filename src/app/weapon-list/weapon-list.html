<html lang="en">
<header>
  <title>List</title>
</header>
<body>
  <h1>Weapon List Display Page</h1>

  <div class="list">
    <h2>Main List</h2>
    @for(weapon of weaponList(); track weapon.id) {
      <app-weapon-list-item [weapon]="weapon"></app-weapon-list-item>
    } @empty {
      <p>Nothing to display.</p>
    }
  </div>
  <br/><br/>
  <div class="list">
    <h2>Weapons with Special</h2>
    @for(weapon of specialWeaponList(); track weapon.id) {
      <app-weapon-list-item [weapon]="weapon"></app-weapon-list-item>
    } @empty {
      <p>Nothing to display.</p>
    }
  </div>
</body>
</html>
